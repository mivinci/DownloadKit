name: CI

# Cancel in-progress runs for the same PR / branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.compiler }} / TLS=${{ matrix.tls_backend }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            tls_backend: openssl
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            tls_backend: mbedtls
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            tls_backend: openssl
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            tls_backend: mbedtls

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dependencies ──────────────────────────────────────────────────────

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtest-dev libgmock-dev libnghttp2-dev cmake \
            libssl-dev libcurl4-openssl-dev libmbedtls-dev
          # Install llhttp from source (no apt package available)
          git clone --depth 1 --branch release/v9.3.1 https://github.com/nodejs/llhttp.git /tmp/llhttp
          cmake -S /tmp/llhttp -B /tmp/llhttp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/llhttp/build
          sudo cmake --install /tmp/llhttp/build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install googletest llhttp nghttp2 openssl mbedtls

      # ── Cache ─────────────────────────────────────────────────────────────

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.tls_backend }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.tls_backend }}-

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          CMAKE_EXTRA_ARGS="-DXK_TLS_BACKEND=${{ matrix.tls_backend }}"
          # Homebrew OpenSSL is keg-only; tell CMake where to find it
          if [ "$RUNNER_OS" = "macOS" ]; then
            OPENSSL_PREFIX="$(brew --prefix openssl 2>/dev/null || true)"
            if [ -n "$OPENSSL_PREFIX" ]; then
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DOPENSSL_ROOT_DIR=$OPENSSL_PREFIX"
            fi
            MBEDTLS_PREFIX="$(brew --prefix mbedtls 2>/dev/null || true)"
            if [ -n "$MBEDTLS_PREFIX" ]; then
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DMBEDTLS_ROOT_DIR=$MBEDTLS_PREFIX"
            fi
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            $CMAKE_EXTRA_ARGS

      - name: Build
        run: cmake --build build --parallel

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "── Attempt $attempt / $max_attempts ──"
            if ctest --test-dir build --output-on-failure --parallel 4; then
              echo "✅ Tests passed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "⚠️  Tests failed, retrying..."
              sleep 2
            fi
          done
          echo "❌ Tests failed after $max_attempts attempts"
          exit 1

  # ── Branch naming lint ────────────────────────────────────────────────────

  lint-branch:
    name: Lint branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(main|qclaw/|codebuddy/|renovate/)'; then
            echo "✅ Branch name OK"
          else
            echo "❌ Branch name '$BRANCH' does not follow convention."
            echo "   Expected prefix: qclaw/ or codebuddy/"
            exit 1
          fi
