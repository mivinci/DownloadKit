name: CI

# Cancel in-progress runs for the same PR / branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'

jobs:
  # ── Detect which modules have changes ────────────────────────────────────
  detect:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.deps.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules and build matrix
        id: deps
        run: scripts/ci-detect-changes.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.event.pull_request.head.sha || github.event.after }}"

  # ── Build & Test per module ──────────────────────────────────────────────
  test:
    name: Test ${{ matrix.module }} (${{ matrix.os }} / ${{ matrix.compiler }} / TLS=${{ matrix.tls_backend }})
    runs-on: ${{ matrix.os }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Dependencies ──────────────────────────────────────────────────────

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: scripts/ci-install-deps-ubuntu.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install googletest llhttp nghttp2 openssl mbedtls libusrsctp cjson

      # ── Cache ─────────────────────────────────────────────────────────────

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.tls_backend }}-${{ matrix.module }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.tls_backend }}-${{ matrix.module }}-

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          CMAKE_EXTRA_ARGS="-DXK_TLS_BACKEND=${{ matrix.tls_backend }}"
          # Homebrew OpenSSL is keg-only; tell CMake where to find it
          if [ "$RUNNER_OS" = "macOS" ]; then
            OPENSSL_PREFIX="$(brew --prefix openssl 2>/dev/null || true)"
            if [ -n "$OPENSSL_PREFIX" ]; then
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DOPENSSL_ROOT_DIR=$OPENSSL_PREFIX"
            fi
            MBEDTLS_PREFIX="$(brew --prefix mbedtls 2>/dev/null || true)"
            if [ -n "$MBEDTLS_PREFIX" ]; then
              CMAKE_EXTRA_ARGS="$CMAKE_EXTRA_ARGS -DMBEDTLS_ROOT_DIR=$MBEDTLS_PREFIX"
            fi
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            $CMAKE_EXTRA_ARGS

      - name: Build module
        run: cmake --build build --target ${{ matrix.module }}_test --parallel

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Run tests
        run: scripts/ci-run-tests.sh "${{ matrix.module }}_test"

  # ── Branch naming lint ────────────────────────────────────────────────────

  lint-branch:
    name: Lint branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(main|qclaw/|codebuddy/|workbuddy/|renovate/)'; then
            echo "✅ Branch name OK"
          else
            echo "❌ Branch name '$BRANCH' does not follow convention."
            echo "   Expected prefix: qclaw/, codebuddy/ or workbuddy/"
            exit 1
          fi
