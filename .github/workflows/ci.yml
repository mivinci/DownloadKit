name: CI

# Cancel in-progress runs for the same PR / branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'

jobs:
  # ── Build & Test ────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }} / TLS=${{ matrix.tls_backend }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tls_backend: [openssl, mbedtls]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Dependencies ──────────────────────────────────────────────────────

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtest-dev libllhttp-dev libnghttp2-dev \
            libssl-dev libmbedtls-dev libcjson-dev libusrsctp-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install googletest llhttp nghttp2 openssl mbedtls libusrsctp cjson

      # ── Cache ─────────────────────────────────────────────────────────────

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.os }}-${{ matrix.tls_backend }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.tls_backend }}-

      # ── Run test script ───────────────────────────────────────────────────

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-linux.sh \
            --ci --asan \
            --base-sha "$BASE_SHA" \
            -t ${{ matrix.tls_backend }} \
            -j "$(nproc)" \
            -B build

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-mac.sh \
            --ci --asan \
            --base-sha "$BASE_SHA" \
            -t ${{ matrix.tls_backend }} \
            -j "$(sysctl -n hw.ncpu)" \
            -B build

  # ── Branch naming lint ────────────────────────────────────────────────────

  lint-branch:
    name: Lint branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(main|qclaw/|codebuddy/|workbuddy/|renovate/)'; then
            echo "✅ Branch name OK"
          else
            echo "❌ Branch name '$BRANCH' does not follow convention."
            echo "   Expected prefix: qclaw/, codebuddy/ or workbuddy/"
            exit 1
          fi
