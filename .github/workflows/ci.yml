name: CI

# Cancel in-progress runs for the same PR / branch on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.c'
      - '**.h'
      - '**.cpp'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - '.github/workflows/ci.yml'

jobs:
  # ── Detect which modules have changes ────────────────────────────────────
  detect:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.deps.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules and build matrix
        id: deps
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.event.after }}"

          # Run detect-only on both OS to get the same affected module list
          AFFECTED=$(bash scripts/test-linux.sh --ci --detect-only --base-sha "$BASE_SHA")

          if [[ -z "$AFFECTED" ]]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build matrix JSON: one entry per (module × os × tls_backend)
          MATRIX_ENTRIES=()
          for m in $AFFECTED; do
            for os in ubuntu-latest macos-latest; do
              for tls in openssl mbedtls; do
                MATRIX_ENTRIES+=("{\"module\":\"${m}\",\"os\":\"${os}\",\"tls_backend\":\"${tls}\"}")
              done
            done
          done

          # Join with comma
          MATRIX_JSON=$(IFS=,; echo "[${MATRIX_ENTRIES[*]}]")
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX_JSON"

  # ── Build & Test per module ──────────────────────────────────────────────
  test:
    name: Test ${{ matrix.module }} (${{ matrix.os }} / TLS=${{ matrix.tls_backend }})
    runs-on: ${{ matrix.os }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Dependencies ──────────────────────────────────────────────────────

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtest-dev libllhttp-dev libnghttp2-dev \
            libssl-dev libmbedtls-dev libcjson-dev libusrsctp-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install googletest llhttp nghttp2 openssl mbedtls libusrsctp cjson

      # ── Cache ─────────────────────────────────────────────────────────────

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ matrix.os }}-${{ matrix.tls_backend }}-${{ matrix.module }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.tls_backend }}-${{ matrix.module }}-

      # ── Run test script ───────────────────────────────────────────────────

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-linux.sh \
            --ci --asan \
            --base-sha "$BASE_SHA" \
            -t ${{ matrix.tls_backend }} \
            -j "$(nproc)" \
            -B build \
            --all

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/test-mac.sh \
            --ci --asan \
            --base-sha "$BASE_SHA" \
            -t ${{ matrix.tls_backend }} \
            -j "$(sysctl -n hw.ncpu)" \
            -B build \
            --all

  # ── Branch naming lint ────────────────────────────────────────────────────

  lint-branch:
    name: Lint branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH"
          if echo "$BRANCH" | grep -qE '^(main|qclaw/|codebuddy/|workbuddy/|renovate/)'; then
            echo "✅ Branch name OK"
          else
            echo "❌ Branch name '$BRANCH' does not follow convention."
            echo "   Expected prefix: qclaw/, codebuddy/ or workbuddy/"
            exit 1
          fi
