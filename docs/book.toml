[book]
title = "moo Documentation"
description = "Low-level C building blocks for event-driven, asynchronous programming"
authors = ["Leo X."]
language = "en"
src = "."

[build]
build-dir = "../book"

[output.html]
git-repository-url = "https://github.com/mivinci/moo"
edit-url-template = "https://github.com/mivinci/moo/edit/main/docs/{path}"
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.fold]
enable = true
level = 1
